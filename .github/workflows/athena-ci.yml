name: ATHENA CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run repository validation
      run: python3 scripts/validate_bootstrap.py
    - name: Run unit tests
      run: PYTHONPATH=src pytest tests/unit/
    - name: Run integration tests
      run: PYTHONPATH=src pytest tests/integration/
    - name: Build documentation
      run: mkdocs build
