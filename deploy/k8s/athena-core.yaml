apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-api
  labels:
    app: athena
spec:
  replicas: 2
  selector:
    matchLabels:
      app: athena
  template:
    metadata:
      labels:
        app: athena
    spec:
      containers:
      - name: athena-api
        image: athena-api:latest
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: athena-api
spec:
  selector:
    app: athena
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
