site_name: ATHENA
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo

nav:
  - Home: index.md
  - Specifications:
      - Master Engineering Specification: specifications/MASTER_ENGINEERING_SPECIFICATION.md
      - Product Requirements Document: specifications/PRODUCT_REQUIREMENTS_DOCUMENT.md
      - Software Requirements Specification: specifications/SOFTWARE_REQUIREMENTS_SPECIFICATION.md
      - Agent Framework Specification: specifications/AGENT_FRAMEWORK_SPECIFICATION.md
      - Knowledge Framework Specification: specifications/KNOWLEDGE_FRAMEWORK_SPECIFICATION.md
      - Memory Framework Specification: specifications/MEMORY_FRAMEWORK_SPECIFICATION.md
      - Workflow Engine Specification: specifications/WORKFLOW_ENGINE_SPECIFICATION.md
      - Debate Engine Specification: specifications/DEBATE_ENGINE_SPECIFICATION.md
      - Consensus Engine Specification: specifications/CONSENSUS_ENGINE_SPECIFICATION.md
      - Document Engine Specification: specifications/DOCUMENT_ENGINE_SPECIFICATION.md
      - Diagram Engine Specification: specifications/DIAGRAM_ENGINE_SPECIFICATION.md
  - Architecture:
      - High Level Architecture: architecture/HIGH_LEVEL_ARCHITECTURE.md
      - ADRs:
          - 0001 - Record Architecture Decisions: architecture/adr/0001-record-architecture-decisions.md
          - 0002 - Repository Structure: architecture/adr/0002-repository-structure.md
          - 0003 - Documentation Standards: architecture/adr/0003-documentation-standards.md
          - 0004 - Product Requirements Baseline: architecture/adr/0004-product-requirements-baseline.md
          - 0005 - Software Requirements Baseline: architecture/adr/0005-software-requirements-baseline.md
          - 0006 - High Level Architecture Baseline: architecture/adr/0006-high-level-architecture-baseline.md
          - 0007 - Agent Framework Design: architecture/adr/0007-agent-framework-design.md
          - 0008 - Knowledge Framework Design: architecture/adr/0008-knowledge-framework-design.md
          - 0009 - Memory Framework Design: architecture/adr/0009-memory-framework-design.md
          - 0010 - Workflow Engine Design: architecture/adr/0010-workflow-engine-design.md
          - 0011 - Debate Engine Design: architecture/adr/0011-debate-engine-design.md
          - 0012 - Consensus Engine Design: architecture/adr/0012-consensus-engine-design.md
          - 0013 - Document Engine Design: architecture/adr/0013-document-engine-design.md
          - 0014 - Diagram Engine Design: architecture/adr/0014-diagram-engine-design.md
  - Templates:
      - Standard Document: templates/standard_document_template.md

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - plantuml_markdown:
      server: http://www.plantuml.com/plantuml

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
