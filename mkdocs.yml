site_name: ATHENA
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo

nav:
  - Home: index.md
  - Specifications:
      - Master Engineering Specification: specifications/MASTER_ENGINEERING_SPECIFICATION.md
  - Architecture:
      - ADRs:
          - 0001 - Record Architecture Decisions: architecture/adr/0001-record-architecture-decisions.md
          - 0002 - Repository Structure: architecture/adr/0002-repository-structure.md

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
